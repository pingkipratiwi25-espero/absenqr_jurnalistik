<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0b0f19">
  <title>Presensi Jurnalistik - Scanner QR</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{margin:0;min-height:100vh;background:#0b0f19;color:#e2e8f0;font-family:'Plus Jakarta Sans',sans-serif;padding:16px;display:flex;justify-content:center;align-items:center}
    .wrap{width:min(100%,540px)}
    .card{background:#161b26;border:1px solid rgba(255, 42, 133, 0.45);border-radius:24px;padding:20px;box-shadow:0 0 25px rgba(255, 42, 133, 0.2)}
    
    .top-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;border-bottom:1px solid rgba(255,42,133,0.2);padding-bottom:14px}
    h1{font-size:18px;margin:0;color:#ff2a85;letter-spacing:0.5px}
    .sub{font-size:12px;color:#94a3b8;margin:4px 0 0}
    .admin-btn{background:#1e293b;color:#f472b6;border:1px solid #ff2a85;border-radius:12px;padding:10px 14px;font-size:12px;font-weight:bold;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
    .admin-btn:active{background:#ff2a85;color:#fff}

    .mode-switch{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;background:#060911;padding:5px;border-radius:14px;border:1px solid #1e293b}
    .mode-btn{border:0;border-radius:10px;padding:12px 10px;font-size:12px;font-weight:bold;cursor:pointer;color:#94a3b8;background:transparent}
    .mode-btn.active-in{background:#059669;color:white}
    .mode-btn.active-out{background:#d97706;color:white}

    #reader{width:100%;min-height:250px;border:1px solid rgba(255, 42, 133, 0.4);border-radius:16px;overflow:hidden;background:#020617}
    #reader video{object-fit:cover}
    
    .status{margin-top:12px;padding:12px 14px;border-radius:12px;background:#060911;color:#cbd5e1;font-size:13px;line-height:1.5;overflow-wrap:anywhere;border:1px solid rgba(255,42,133,0.25)}
    .status.success{border-color:#10b981;background:rgba(16,185,129,0.12);color:#6ee7b7}
    .status.error{border-color:#f43f5e;background:rgba(244,63,94,0.12);color:#fda4af}

    .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
    button{border:0;border-radius:12px;padding:12px 14px;font-weight:bold;font-size:12px;cursor:pointer}
    button:disabled{opacity:.4;cursor:not-allowed}
    .primary{background:linear-gradient(135deg, #ff2a85, #b527cf);color:white;flex:1}
    .secondary{background:#1e293b;color:#e2e8f0;border:1px solid #334155}
    .danger{background:#be123c;color:white}

    .manual-box{margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,42,133,0.2)}
    .manual-label{display:block;font-size:11px;font-weight:bold;color:#f472b6;margin-bottom:6px;text-transform:uppercase}
    .manual-row{display:flex;gap:8px}
    .manual-input{flex:1;background:#060911;border:1px solid #334155;border-radius:12px;padding:11px 14px;color:white;font-size:13px;font-family:monospace;outline:none}
    .hint{font-size:11px;color:#64748b;margin-top:14px;text-align:center}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <div class="top-bar">
        <div>
          <h1>PRESENSI JURNALISTIK</h1>
          <p class="sub">SMPN 2 Tumpang • Pindai QR</p>
        </div>
        <!-- Ganti URL href di bawah ini dengan URL Web App Apps Script Anda -->
        <a href="https://script.google.com/macros/s/AKfycbwzZrtv-1NeqU7U-RElQCWigFzIZOn8AclfvhYyq35qsaGMU5d0WlPd-Kxmv1I45I4B/exec" class="admin-btn" id="adminLoginBtn">🔐 Login Admin</a>
      </div>

      <div class="mode-switch">
        <button type="button" id="btnModeIn" class="mode-btn active-in">📥 MODE DATANG</button>
        <button type="button" id="btnModeOut" class="mode-btn">📤 MODE PULANG</button>
      </div>

      <div id="reader"></div>
      <div class="status" id="status">Pilih mode (Datang/Pulang), lalu tekan <b>Aktifkan Kamera</b>.</div>

      <div class="actions">
        <button type="button" class="primary" id="startBtn">📷 Aktifkan Kamera</button>
        <button type="button" class="secondary" id="switchBtn" disabled>🔄 Ganti Kamera</button>
        <button type="button" class="danger" id="stopBtn" disabled>⏹ Matikan</button>
      </div>

      <div class="manual-box">
        <label class="manual-label" for="manualNisnInput">Input NISN Manual (Cadangan)</label>
        <div class="manual-row">
          <input type="text" id="manualNisnInput" inputmode="numeric" maxlength="10" class="manual-input" placeholder="Ketik 10 digit NISN...">
          <button type="button" class="primary" id="manualSubmitBtn" style="flex:0 0 auto; padding: 11px 18px;">Kirim</button>
        </div>
      </div>

      <p class="hint">Copyright &copy; 2026 opit_espero • Terhubung ke Google Sheets</p>
    </section>
  </main>

<script>
  // Ganti konstanta URL di bawah ini dengan URL Web App Google Apps Script Anda yang aktif
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwzZrtv-1NeqU7U-RElQCWigFzIZOn8AclfvhYyq35qsaGMU5d0WlPd-Kxmv1I45I4B/exec';

  let currentMode = 'in';
  let scanner = null;
  let cameras = [];
  let cameraIndex = -1;
  let busy = false;
  let started = false;

  function setStatus(message, type = 'normal') {
    const el = document.getElementById('status');
    el.innerHTML = message;
    el.className = 'status' + (type === 'success' ? ' success' : type === 'error' ? ' error' : '');
  }

  document.getElementById('btnModeIn').addEventListener('click', function() {
    currentMode = 'in';
    this.className = 'mode-btn active-in';
    document.getElementById('btnModeOut').className = 'mode-btn';
    setStatus('Mode aktif: <b>DATANG</b>. Silakan pindai QR siswa.');
  });

  document.getElementById('btnModeOut').addEventListener('click', function() {
    currentMode = 'out';
    this.className = 'mode-btn active-out';
    document.getElementById('btnModeIn').className = 'mode-btn';
    setStatus('Mode aktif: <b>PULANG</b>. Silakan pindai QR siswa.');
  });

  document.getElementById('startBtn').addEventListener('click', startCamera);
  document.getElementById('switchBtn').addEventListener('click', switchCamera);
  document.getElementById('stopBtn').addEventListener('click', stopCamera);
  document.getElementById('manualSubmitBtn').addEventListener('click', submitManualNisn);
  document.getElementById('manualNisnInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') submitManualNisn();
  });

  async function startCamera() {
    if (typeof Html5Qrcode === 'undefined') {
      setStatus('Library QR Scanner gagal dimuat. Periksa koneksi internet Anda.', 'error');
      return;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setStatus('WebView tidak mendukung akses kamera.', 'error');
      return;
    }
    document.getElementById('startBtn').disabled = true;
    setStatus('Meminta akses kamera...');
    try {
      cameras = await Html5Qrcode.getCameras();
      if (!cameras || !cameras.length) throw new Error('Kamera tidak ditemukan.');
      if (cameraIndex < 0 || cameraIndex >= cameras.length) {
        const idx = cameras.findIndex(c => /back|rear|environment|belakang/i.test(c.label || ''));
        cameraIndex = idx >= 0 ? idx : 0;
      }
      if (!scanner) scanner = new Html5Qrcode('reader', { verbose: false });
      await scanner.start(
        { deviceId: { exact: cameras[cameraIndex].id } },
        { fps: 10, qrbox: { width: 220, height: 220 } },
        onQrDecoded,
        function() {}
      );
      started = true;
      document.getElementById('switchBtn').disabled = cameras.length < 2;
      document.getElementById('stopBtn').disabled = false;
      setStatus('Kamera aktif (<b>' + (currentMode === 'in' ? 'DATANG' : 'PULANG') + '</b>). Arahkan QR ke kotak.');
    } catch (err) {
      document.getElementById('startBtn').disabled = false;
      setStatus('Gagal membuka kamera: ' + (err && err.message ? err.message : String(err)), 'error');
    }
  }

  async function switchCamera() {
    if (!cameras.length) return;
    if (started) await stopCamera();
    cameraIndex = (cameraIndex + 1) % cameras.length;
    await startCamera();
  }

  async function stopCamera() {
    if (scanner && started) {
      try { await scanner.stop(); } catch (e) {}
    }
    started = false;
    document.getElementById('startBtn').disabled = false;
    document.getElementById('stopBtn').disabled = true;
    document.getElementById('switchBtn').disabled = cameras.length < 2;
    document.getElementById('reader').style.opacity = '1';
    setStatus('Kamera dimatikan.');
  }

  async function onQrDecoded(decodedText) {
    if (busy) return;
    let nisn = String(decodedText == null ? '' : decodedText).trim();
    if (!/^\d{1,10}$/.test(nisn)) {
      setStatus('QR tidak valid (harus 10 digit angka NISN).', 'error');
      return;
    }
    nisn = nisn.padStart(10, '0');
    
    busy = true;
    setStatus('⏳ Mengirim NISN <b>' + nisn + '</b>...');
    document.getElementById('reader').style.opacity = '0.45';
    try { if (scanner && started) await scanner.pause(true); } catch (e) {}

    try {
      const response = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'scan', nisn: nisn, mode: currentMode })
      });
      const res = await response.json();

      if (res.status === 'success') {
        setStatus(`✔ <b>BERHASIL (${res.type})!</b><br>${res.student.name} (${res.student.class_name}) • ${res.time}`, 'success');
      } else {
        setStatus(`✖ <b>GAGAL:</b> ${res.message}`, 'error');
      }
    } catch (err) {
      setStatus('✖ Gagal terhubung ke Google Sheets.', 'error');
    }

    setTimeout(async () => {
      busy = false;
      document.getElementById('reader').style.opacity = '1';
      try { if (scanner && started) await scanner.resume(); } catch (e) {}
    }, 2000);
  }

  function submitManualNisn() {
    const inputField = document.getElementById('manualNisnInput');
    const val = inputField.value.trim();
    if (!val) {
      setStatus('Masukkan NISN terlebih dahulu!', 'error');
      return;
    }
    onQrDecoded(val);
    inputField.value = '';
  }
</script>
</body>
</html>
