<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#050b14">
  <title>Presensi Ekstrakurikuler Jurnalistik - Scanner QR</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #050b14;
      color: #eaf4ff;
      margin: 0;
    }

    .cyber-bg {
      background-color: #050b14;
      background-image:
        radial-gradient(circle at 50% 0%, rgba(6, 182, 212, 0.16) 0%, transparent 55%),
        radial-gradient(circle at 85% 90%, rgba(79, 70, 229, 0.14) 0%, transparent 50%),
        linear-gradient(rgba(56, 189, 248, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56, 189, 248, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 26px 26px, 26px 26px;
    }

    .futuristic-card {
      background: linear-gradient(165deg, rgba(15, 28, 48, 0.94) 0%, rgba(8, 16, 30, 0.98) 100%);
      border: 1px solid rgba(56, 189, 248, 0.22);
      box-shadow: 0 20px 45px -10px rgba(0, 0, 0, 0.8), 0 0 24px rgba(6, 182, 212, 0.08);
      position: relative;
      overflow: hidden;
    }

    .futuristic-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 15%;
      right: 15%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #22d3ee, #818cf8, transparent);
    }

    @keyframes pulseRing {
      0% { transform: scale(0.96); opacity: 0.55; }
      50% { transform: scale(1.06); opacity: 0.2; }
      100% { transform: scale(0.96); opacity: 0.55; }
    }
    .icon-halo {
      animation: pulseRing 3s ease-in-out infinite;
    }

    .cyber-input-wrap {
      background-color: #0b1628;
      border: 1px solid rgba(125, 168, 219, 0.22);
      border-radius: 14px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .cyber-input-wrap:focus-within {
      border-color: #22d3ee;
      box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.14);
    }

    #reader {
      width: 100%;
      min-height: 240px;
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 18px;
      overflow: hidden;
      background: #060d18;
    }
    #reader video {
      object-fit: cover;
    }

    .status-box {
      background-color: #0b1628;
      border: 1px solid rgba(125, 168, 219, 0.22);
      color: #cbd5e1;
    }
    .status-box.success {
      border-color: rgba(16, 185, 129, 0.5);
      background: rgba(16, 185, 129, 0.12);
      color: #6ee7b7;
    }
    .status-box.error {
      border-color: rgba(244, 63, 94, 0.5);
      background: rgba(244, 63, 94, 0.12);
      color: #fda4af;
    }
  </style>
</head>
<body class="cyber-bg min-h-[100dvh] flex flex-col justify-between items-center px-5 py-7">

  <!-- Badge Status Sistem Atas -->
  <div class="w-full max-w-md flex justify-center pt-1">
    <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-cyan-950/60 border border-cyan-400/25 text-[10px] font-bold tracking-widest text-cyan-300 uppercase">
      <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
      Smart Attendance System
    </div>
  </div>

  <!-- Kartu Utama Scanner QR -->
  <main class="w-full max-w-md futuristic-card rounded-3xl p-6 sm:p-7 my-auto space-y-5">

    <!-- Header & Ikon Identik dengan Login Page -->
    <div class="text-center space-y-2">
      <div class="relative w-16 h-16 mx-auto flex items-center justify-center">
        <div class="absolute inset-0 rounded-2xl bg-cyan-400/25 icon-halo"></div>
        <div class="relative w-14 h-14 bg-gradient-to-br from-cyan-400 via-sky-500 to-indigo-600 rounded-2xl flex items-center justify-center shadow-lg shadow-cyan-500/30 text-slate-950 text-2xl">
          <i class="fas fa-qrcode"></i>
        </div>
      </div>

      <div>
        <p class="text-[10px] font-extrabold tracking-[0.22em] text-cyan-400 uppercase">E-Presensi Ekstrakurikuler</p>
        <h1 class="text-xl sm:text-2xl font-extrabold text-white tracking-tight leading-snug mt-0.5">
          Jurnalistik
        </h1>
        <div class="inline-block mt-1 px-3 py-0.5 rounded-lg bg-white/5 border border-white/10">
          <p class="text-[11px] text-slate-300 font-bold tracking-wide uppercase">
            SMP NEGERI 2 TUMPANG
          </p>
        </div>
      </div>
    </div>

    <!-- Switch Mode Datang / Pulang -->
    <div class="grid grid-cols-2 gap-2 p-1.5 rounded-2xl bg-[#07101e] border border-white/10">
      <button type="button" id="btnModeIn" class="py-2.5 px-3 rounded-xl text-xs font-black tracking-wide uppercase transition-all bg-emerald-500 text-slate-950 shadow-md flex items-center justify-center gap-1.5">
        <i class="fas fa-right-to-bracket"></i> MODE DATANG
      </button>
      <button type="button" id="btnModeOut" class="py-2.5 px-3 rounded-xl text-xs font-bold tracking-wide uppercase transition-all text-slate-400 hover:text-white flex items-center justify-center gap-1.5">
        <i class="fas fa-right-from-bracket"></i> MODE PULANG
      </button>
    </div>

    <!-- Area Pemindai Kamera -->
    <div class="space-y-3">
      <div id="reader"></div>

      <div id="status" class="status-box rounded-2xl p-3.5 text-xs leading-relaxed">
        Pilih mode (Datang/Pulang), lalu tekan <b>Aktifkan Kamera</b>.
      </div>

      <!-- Tombol Kontrol Kamera -->
      <div class="flex gap-2">
        <button type="button" id="startBtn" class="flex-1 bg-gradient-to-r from-cyan-400 via-sky-400 to-blue-600 text-slate-950 font-black py-3 px-4 rounded-2xl shadow-lg shadow-cyan-500/20 active:scale-[0.98] transition-all text-xs tracking-wider uppercase flex items-center justify-center gap-2 disabled:opacity-40">
          <i class="fas fa-camera"></i> Aktifkan Kamera
        </button>
        <button type="button" id="switchBtn" disabled class="px-3.5 py-3 rounded-2xl bg-[#0b1628] border border-cyan-400/25 text-cyan-300 text-xs font-bold disabled:opacity-40" title="Ganti Kamera">
          <i class="fas fa-camera-rotate"></i>
        </button>
        <button type="button" id="stopBtn" disabled class="px-3.5 py-3 rounded-2xl bg-rose-600/90 text-white text-xs font-bold disabled:opacity-40" title="Matikan Kamera">
          <i class="fas fa-stop"></i>
        </button>
      </div>
    </div>

    <!-- Input NISN Manual -->
    <div class="pt-3 border-t border-white/10">
      <label for="manualNisnInput" class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5 ml-1">
        Input NISN Manual (Cadangan)
      </label>
      <div class="flex gap-2">
        <div class="cyber-input-wrap flex-1 flex items-center px-3.5">
          <i class="fas fa-id-card text-cyan-400/80 text-sm mr-2.5"></i>
          <input type="text" id="manualNisnInput" inputmode="numeric" maxlength="10" placeholder="Ketik 10 digit NISN..." class="bg-transparent border-none text-white text-sm font-mono font-semibold w-full py-3 outline-none placeholder-slate-500">
        </div>
        <button type="button" id="manualSubmitBtn" class="px-5 py-3 bg-gradient-to-r from-cyan-400 to-blue-600 text-slate-950 font-black rounded-2xl text-xs uppercase tracking-wider shadow-md active:scale-95 transition">
          Kirim
        </button>
      </div>
    </div>

    <!-- Pemisah & Akses Admin Identik dengan Login Page -->
    <div class="pt-3 border-t border-white/10">
      <a href="https://script.google.com/macros/s/AKfycbwzZrtv-1NeqU7U-RElQCWigFzIZOn8AclfvhYyq35qsaGMU5d0WlPd-Kxmv1I45I4B/exec" id="adminLoginBtn" class="flex items-center justify-between w-full py-3 px-4 rounded-2xl bg-[#0a1322] border border-indigo-400/25 text-slate-200 hover:border-cyan-400/50 active:scale-[0.99] transition">
        <div class="flex items-center gap-2.5">
          <span class="w-7 h-7 rounded-xl bg-indigo-500/20 text-indigo-300 flex items-center justify-center text-xs">
            <i class="fas fa-user-shield"></i>
          </span>
          <div class="text-left">
            <p class="text-[11px] font-bold text-white leading-none">Panel Administrator</p>
            <p class="text-[9px] text-slate-400 mt-1">Login admin / guru untuk kelola data</p>
          </div>
        </div>
        <i class="fas fa-arrow-up-right-from-square text-xs text-cyan-400"></i>
      </a>
    </div>
  </main>

  <!-- Footer -->
  <footer class="text-center pt-3">
    <p class="text-[10px] text-slate-500 font-medium tracking-wide">
      Copyright &copy; 2026 <span class="text-slate-400 font-bold">opit_espero</span> • All Right Reserved
    </p>
  </footer>

<script>
  // URL Web App Google Apps Script Anda
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwzZrtv-1NeqU7U-RElQCWigFzIZOn8AclfvhYyq35qsaGMU5d0WlPd-Kxmv1I45I4B/exec';

  let currentMode = 'in';
  let scanner = null;
  let cameras = [];
  let cameraIndex = -1;
  let busy = false;
  let started = false;

  function setStatus(message, type = 'normal') {
    const el = document.getElementById('status');
    el.innerHTML = message;
    el.className = 'status-box rounded-2xl p-3.5 text-xs leading-relaxed' + (type === 'success' ? ' success' : type === 'error' ? ' error' : '');
  }

  document.getElementById('btnModeIn').addEventListener('click', function() {
    currentMode = 'in';
    this.className = 'py-2.5 px-3 rounded-xl text-xs font-black tracking-wide uppercase transition-all bg-emerald-500 text-slate-950 shadow-md flex items-center justify-center gap-1.5';
    document.getElementById('btnModeOut').className = 'py-2.5 px-3 rounded-xl text-xs font-bold tracking-wide uppercase transition-all text-slate-400 hover:text-white flex items-center justify-center gap-1.5';
    setStatus('Mode aktif: <b>DATANG</b>. Silakan pindai QR siswa.');
  });

  document.getElementById('btnModeOut').addEventListener('click', function() {
    currentMode = 'out';
    this.className = 'py-2.5 px-3 rounded-xl text-xs font-black tracking-wide uppercase transition-all bg-amber-500 text-slate-950 shadow-md flex items-center justify-center gap-1.5';
    document.getElementById('btnModeIn').className = 'py-2.5 px-3 rounded-xl text-xs font-bold tracking-wide uppercase transition-all text-slate-400 hover:text-white flex items-center justify-center gap-1.5';
    setStatus('Mode aktif: <b>PULANG</b>. Silakan pindai QR siswa.');
  });

  document.getElementById('startBtn').addEventListener('click', startCamera);
  document.getElementById('switchBtn').addEventListener('click', switchCamera);
  document.getElementById('stopBtn').addEventListener('click', stopCamera);
  document.getElementById('manualSubmitBtn').addEventListener('click', submitManualNisn);
  document.getElementById('manualNisnInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') submitManualNisn();
  });

  async function startCamera() {
    if (typeof Html5Qrcode === 'undefined') {
      setStatus('Library QR Scanner gagal dimuat. Periksa koneksi internet Anda.', 'error');
      return;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setStatus('Browser/WebView tidak mendukung akses kamera.', 'error');
      return;
    }
    document.getElementById('startBtn').disabled = true;
    setStatus('Meminta akses kamera...');
    try {
      cameras = await Html5Qrcode.getCameras();
      if (!cameras || !cameras.length) throw new Error('Kamera tidak ditemukan.');
      if (cameraIndex < 0 || cameraIndex >= cameras.length) {
        const idx = cameras.findIndex(c => /back|rear|environment|belakang/i.test(c.label || ''));
        cameraIndex = idx >= 0 ? idx : 0;
      }
      if (!scanner) scanner = new Html5Qrcode('reader', { verbose: false });
      await scanner.start(
        { deviceId: { exact: cameras[cameraIndex].id } },
        { fps: 10, qrbox: { width: 220, height: 220 } },
        onQrDecoded,
        function() {}
      );
      started = true;
      document.getElementById('switchBtn').disabled = cameras.length < 2;
      document.getElementById('stopBtn').disabled = false;
      setStatus('Kamera aktif (<b>' + (currentMode === 'in' ? 'DATANG' : 'PULANG') + '</b>). Arahkan QR ke kotak.');
    } catch (err) {
      document.getElementById('startBtn').disabled = false;
      setStatus('Gagal membuka kamera: ' + (err && err.message ? err.message : String(err)), 'error');
    }
  }

  async function switchCamera() {
    if (!cameras.length) return;
    if (started) await stopCamera();
    cameraIndex = (cameraIndex + 1) % cameras.length;
    await startCamera();
  }

  async function stopCamera() {
    if (scanner && started) {
      try { await scanner.stop(); } catch (e) {}
    }
    started = false;
    document.getElementById('startBtn').disabled = false;
    document.getElementById('stopBtn').disabled = true;
    document.getElementById('switchBtn').disabled = cameras.length < 2;
    document.getElementById('reader').style.opacity = '1';
    setStatus('Kamera dimatikan.');
  }

  async function onQrDecoded(decodedText) {
    if (busy) return;
    let nisn = String(decodedText == null ? '' : decodedText).trim();
    if (!/^\d{10}$/.test(nisn)) {
      setStatus('QR/NISN tidak valid (harus tepat 10 digit angka).', 'error');
      return;
    }

    busy = true;
    setStatus('⏳ Mengirim NISN <b>' + nisn + '</b>...');
    document.getElementById('reader').style.opacity = '0.45';
    try { if (scanner && started) await scanner.pause(true); } catch (e) {}

    try {
      const response = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'scan', nisn: nisn, mode: currentMode })
      });
      const res = await response.json();

      if (res.status === 'success') {
        setStatus(`✔ <b>BERHASIL (${res.type})!</b><br>${res.student.name} (${res.student.class_name}) • ${res.time}`, 'success');
      } else {
        setStatus(`✖ <b>GAGAL:</b> ${res.message}`, 'error');
      }
    } catch (err) {
      setStatus('✖ Gagal terhubung ke Google Sheets.', 'error');
    }

    setTimeout(async () => {
      busy = false;
      document.getElementById('reader').style.opacity = '1';
      try { if (scanner && started) await scanner.resume(); } catch (e) {}
    }, 2000);
  }

  function submitManualNisn() {
    const inputField = document.getElementById('manualNisnInput');
    const val = inputField.value.trim();
    if (!val) {
      setStatus('Masukkan NISN terlebih dahulu!', 'error');
      return;
    }
    onQrDecoded(val);
    inputField.value = '';
  }
</script>
</body>
</html>
